;let shown=[];function title(r){return lang==='en'?r.en:r.tc}function render(){document.documentElement.lang=lang==='tc'?'zh-Hant-HK':lang==='sc'?'zh-Hans':'en';$('#heading').textContent=T('title');$('#subheading').textContent=T('sub');$('#backUnit').textContent=T('unit');$('#backDmc').textContent=T('dmc');$('#disclaimer').textContent=T('disc');$('#pdfMain').textContent=T('source')+' ↗';$('#bottomNote').textContent=T('note');$('#lang').value=lang;$('#filters').innerHTML=['all','residential','roof','location','development','legend','parking','section','elevation'].map(c=>`<button type="button" class="filter ${cat===c?'active':''}" data-filter="${c}">${T(c)}</button>`).join('');shown=cat==='all'?RECORDS:RECORDS.filter(r=>r.cat===cat);$('#resultCount').textContent=shown.length+' '+T('n');$('#cards').innerHTML=shown.map(r=>`<article class="card" id="p${r.page}"><button class="imgbutton" data-open="${r.page}" title="${esc(T('view'))}"><img loading="lazy" decoding="async" src="brochure/drawing-thumb-${r.page}.webp" alt="${esc(r.en)}"><span class="lens">⌕</span></button><div class="body"><h2>${esc(title(r))}</h2><p class="eng" lang="en">${esc(r.en)}</p><p class="page">${T('page')} ${r.page} ${lang==='en'?'':'頁'}</p><div class="actions"><button class="act" data-open="${r.page}">${T('view')} ↗</button><a class="act outline" href="${link(r.page)}" target="_blank" rel="noopener noreferrer">PDF ↗</a></div></div></article>`).join('');document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{cat=b.dataset.filter;try{history.replaceState(null,'','?category='+cat)}catch{}render()});document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>show(Number(b.dataset.open)));}
